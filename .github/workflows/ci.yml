name: CI
on:
  push:
    branches: [master]
    tags: ['v*\+build.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run test:offline
      - run: npm run typecheck
      - run: npm run export:android
  android:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXPO_PUBLIC_SERVER_URL: https://inteliagent.com.br
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Restore protected native configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$KEYSTORE" && test -n "$FIREBASE"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          printf '%s' "$FIREBASE" > google-services.json
      - run: npm ci
      - run: node scripts/prepare-firebase-native.cjs
      - name: Build standalone APK
        working-directory: android
        run: bash gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Prepare verified release manifest
        run: node scripts/ci-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.sha }}
          path: release/*
          retention-days: 30
      - name: Publish version tag without replacing existing releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(node -p "'v'+require('./app.json').expo.version+'+build.'+require('./app.json').expo.android.versionCode")"
          test "$TAG" = "$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; immutable assets preserved.'
            exit 1
          fi
          gh release create "$TAG" release/* --verify-tag --title "Inteliagent $TAG" --generate-notes
      - name: Remove signing files
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH" google-services.json android/app/google-services.json
